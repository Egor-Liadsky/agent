[package]
name = "crm-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "crm-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.4", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "transport-child-process"] }
tempfile = "3"
